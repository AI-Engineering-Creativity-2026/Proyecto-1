name: Distribuir SDK

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar-npm:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Instalar dependencias reproduciblemente
        run: bun ci

      - name: Verificar versión del tag
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(bun -e \"console.log(require('./package.json').version)\")"

      - name: Build de distribución
        run: bun run build

      - name: Publicar paquete
        run: bun publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
