name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  detectar-proyecto:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.proyecto.outputs.node }}
    steps:
      - uses: actions/checkout@v4

      - id: proyecto
        name: Detectar proyecto Node.js
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  calidad:
    needs: detectar-proyecto
    if: needs.detectar-proyecto.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Instalar dependencias reproduciblemente
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Comprobación de tipos
        run: bun run typecheck

      - name: Pruebas y cobertura
        run: bun run test:coverage

      - name: Build
        run: bun run build

  bootstrap-pendiente:
    needs: detectar-proyecto
    if: needs.detectar-proyecto.outputs.node != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Informar estado de bootstrap
        run: |
          echo "Aún no hay package.json en la raíz."
          echo "Al agregar package.json y bun.lock, defina lint, typecheck, test:coverage y build para activar las verificaciones de CI."
